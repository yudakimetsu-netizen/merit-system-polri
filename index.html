<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merit System Personel Polri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; }
    .sidebar { background-color: #1e3a8a; }
    .sidebar a { color: #bfdbfe; }
    .sidebar a:hover { color: #ffffff; background-color: #1e40af; }
    .sidebar .active { color: #ffffff; background-color: #1d4ed8; }
  </style>
</head>
<body class="h-screen flex overflow-hidden font-sans">

  <!-- HALAMAN LOGIN -->
  <div id="login-page" class="flex-1 flex items-center justify-center">
    <div class="bg-white p-8 rounded shadow-md w-96">
      <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">MERIT SYSTEM POLRI</h2>
      <form id="login-form">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="username" class="mt-1 w-full p-2 border rounded" required>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" class="mt-1 w-full p-2 border rounded" required>
        </div>
        <button type="submit" class="w-full bg-blue-700 text-white p-2 rounded hover:bg-blue-800">Login</button>
      </form>
      <p id="login-error" class="text-red-500 text-sm mt-2 text-center"></p>
    </div>
  </div>

  <!-- HALAMAN DASHBOARD -->
  <div id="dashboard-page" class="flex-1 flex hidden">
    <aside class="sidebar w-64 flex flex-col">
      <div class="p-4 text-white text-xl font-bold border-b border-blue-800">
        <span class="text-yellow-400">*</span> Merit Polri
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="#" class="block p-2 rounded active">Dashboard</a>
        <a href="#" onclick="loadPersonel()" class="block p-2 rounded">Data Personel</a>
        <a href="#" class="block p-2 rounded">Scope Organisasi</a>
        <a href="#" class="block p-2 rounded">Ganti Password</a>
      </nav>
      <div class="p-4 border-t border-blue-800">
        <p class="text-white text-sm">admin</p>
        <button onclick="logout()" class="text-sm text-yellow-400 hover:text-white mt-2">Logout</button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-semibold text-gray-800">Dashboard</h1>
        <span class="text-gray-500 text-sm">Selamat Datang, Admin</span>
      </header>

      <div class="flex-1 p-6 overflow-y-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
            <p class="text-gray-500 text-sm">Total Personel</p>
            <p class="text-2xl font-bold text-gray-800" id="total-personel">0</p>
          </div>
          <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
            <p class="text-gray-500 text-sm">Jabatan Aktif</p>
            <p class="text-2xl font-bold text-gray-800">0</p>
          </div>
          <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
            <p class="text-gray-500 text-sm">Satker</p>
            <p class="text-2xl font-bold text-gray-800">2</p>
          </div>
        </div>

        <div class="bg-white rounded shadow p-4">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-800">Data Personel</h2>
            <button onclick="alert('Fitur tambah masih dalam pengembangan')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">+ Tambah Personel</button>
          </div>
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                <th class="p-3 border-b">NRP</th>
                <th class="p-3 border-b">Nama</th>
                <th class="p-3 border-b">Pangkat</th>
                <th class="p-3 border-b">Tempat Lahir</th>
                <th class="p-3 border-b">Aksi</th>
              </tr>
            </thead>
            <tbody id="personel-table" class="text-gray-700 text-sm">
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    var API_URL = 'http://localhost:3000/api';

    // 1. FUNGSI LOGIN
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      var errorMsg = document.getElementById('login-error');

      try {
        var response = await fetch(API_URL + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });

        var data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          showDashboard();
        } else {
          errorMsg.innerText = data.message || 'Login gagal';
        }
      } catch (error) {
        errorMsg.innerText = 'Tidak dapat terhubung ke server.';
      }
    });

    // 2. FUNGSI MENAMPILKAN DASHBOARD
    function showDashboard() {
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('dashboard-page').classList.remove('hidden');
      loadPersonel();
    }

    // 3. FUNGSI AMBIL DATA PERSONEL
    async function loadPersonel() {
      var token = localStorage.getItem('token');
      if (!token) return logout();

      try {
        var response = await fetch(API_URL + '/personel', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (response.status === 401) return logout();

        var result = await response.json();
        var tbody = document.getElementById('personel-table');
        tbody.innerHTML = '';

        var total = 0;
        if (result.meta) {
          total = result.meta.total;
        } else {
          total = result.data.length;
        }
        document.getElementById('total-personel').innerText = total;

        if (result.data && result.data.length > 0) {
          for (var i = 0; i < result.data.length; i++) {
            var p = result.data[i];
            var tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50';

            var tdNrp = document.createElement('td');
            tdNrp.className = 'p-3 border-b';
            tdNrp.textContent = p.nrp;
            tr.appendChild(tdNrp);

            var tdNama = document.createElement('td');
            tdNama.className = 'p-3 border-b font-medium';
            tdNama.textContent = p.nama;
            tr.appendChild(tdNama);

            var tdPangkat = document.createElement('td');
            tdPangkat.className = 'p-3 border-b';
            tdPangkat.textContent = p.pangkat;
            tr.appendChild(tdPangkat);

            var tdTempat = document.createElement('td');
            tdTempat.className = 'p-3 border-b';
            tdTempat.textContent = p.tempatLahir;
            tr.appendChild(tdTempat);

            var tdAksi = document.createElement('td');
            tdAksi.className = 'p-3 border-b';
            var btn = document.createElement('button');
            btn.className = 'text-blue-600 hover:underline';
            btn.textContent = 'Lihat';
            btn.onclick = function() { alert('Detail: ' + p.nama); };
            tdAksi.appendChild(btn);
            tr.appendChild(tdAksi);

            tbody.appendChild(tr);
          }
        } else {
          tbody.innerHTML = '<tr><td colspan="5" class="p-3 text-center text-gray-500">Belum ada data personel.</td></tr>';
        }
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    // 4. FUNGSI LOGOUT
    function logout() {
      localStorage.removeItem('token');
      document.getElementById('dashboard-page').classList.add('hidden');
      document.getElementById('login-page').classList.remove('hidden');
    }

    if (localStorage.getItem('token')) {
      showDashboard();
    }
  </script>
</body>
</html>
